<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StitchGrid - Offline & Fast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div style="display:flex; align-items:center; gap:8px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
            <h1>StitchGrid</h1>
            <button id="debugBtn" class="debug-btn" title="Show system info">Debug</button>
        </div>
        <div style="display:flex; gap:8px;">
             <button id="exportSectionsBtn" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="M3 9h18"/></svg>
                Sections
            </button>
             <button id="saveBtn" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                Save
            </button>
             <button id="exportBtn" class="primary" disabled>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                Export
            </button>
        </div>
    </header>

    <div class="main-container">
        
        <!-- Sidebar -->
        <aside>
            <!-- Upload -->
            <div>
                <h2>1. Source Image</h2>
                <label for="fileInput" class="upload-box">
                    <svg style="width:24px; height:24px; color:#94a3b8; margin-bottom:4px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
                    <div class="upload-text"><strong>Click to Upload</strong></div>
                    <input id="fileInput" type="file" class="hidden" accept="image/*,.json" />
                </label>
                <img id="sourcePreview" class="preview-img hidden" alt="Source">
            </div>

            <div class="divider"></div>

            <!-- Settings -->
            <div>
                <h2>2. Configuration</h2>
                
                <div class="control-row">
                    <label>Columns (Width)</label>
                    <input type="number" id="widthNum" min="1" max="5000" value="100">
                </div>

                <div class="control-row" style="margin-bottom:0.25rem;">
                    <label>Rows (Height)</label>
                    <input type="number" id="heightNum" min="1" max="5000" value="100" disabled>
                </div>
                
                <div style="display:flex; gap:0.5rem; align-items:center; margin-bottom:0.75rem;">
                    <input type="checkbox" id="unlockRatio">
                    <label for="unlockRatio" style="font-size:0.75rem; color:#64748b;">Unlock Aspect Ratio</label>
                </div>

                <div class="control-row">
                    <label title="Stitches per 10cm">Stitches / 10cm</label>
                    <input type="number" id="densityNum" min="10" max="200" value="55">
                </div>

                <div class="control-row">
                    <label>Contrast (%)</label>
                    <input type="number" id="contrastNum" min="-50" max="100" value="0">
                </div>

                <div class="control-row">
                    <label>Palette Size</label>
                    <input type="number" id="colorCountNum" min="2" max="32" value="2">
                </div>

                <div id="paletteDisplay" class="palette"></div>

                <button id="processBtn" class="primary" style="width:100%; margin-top:1rem; background:#1e293b;" disabled>
                    Generate Pattern
                </button>
            </div>

            <div class="divider"></div>

            <!-- Tools -->
            <div>
                <h2>3. Refine</h2>
                
                <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
                    <button id="toolPencil" class="tool-btn active">Paint</button>
                    <button id="toolEraser" class="tool-btn">Erase</button>
                    <button id="toolFill" class="tool-btn">Fill</button>
                    <button id="toolLine" class="tool-btn">Line</button>
                    <button id="toolRectangle" class="tool-btn">Rectangle</button>
                </div>

                <div class="active-color-row">
                    <label style="font-size:0.75rem; font-weight:700; color:#64748b; text-transform:uppercase; display:block; margin-bottom:0.5rem;">Active Color</label>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div style="display:flex; align-items:center; gap:0.5rem;">
                            <div id="activeColorDisplay" class="color-preview" style="background-color: #ffffff;"></div>
                            <span id="colorHex" style="font-family:monospace; font-size:0.75rem;">#ffffff</span>
                        </div>
                        <label style="color:var(--primary); font-size:0.75rem; font-weight:600; cursor:pointer;">
                            Pick New
                            <input type="color" id="colorPicker" value="#ffffff" style="opacity:0; width:1px; height:1px; position:absolute;">
                        </label>
                    </div>
                    <button id="batchReplaceBtn" style="width:100%; margin-top:0.5rem; font-size:0.75rem; padding:4px;">Replace All Active</button>
                </div>

                <div style="margin-top:1rem; display:flex; flex-direction:column; gap:0.5rem;">
                    <div style="display:flex; align-items:center; gap:0.5rem;">
                        <input type="checkbox" id="showGridLines" checked>
                        <label for="showGridLines" style="font-size:0.875rem;">Show Grid Lines</label>
                    </div>
                    <div style="display:flex; align-items:center; gap:0.5rem;">
                        <input type="checkbox" id="showSections">
                        <label for="showSections" style="font-size:0.875rem;">Mark 100x100 Blocks</label>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main>
            <div class="status-bar">
                <span id="statusText">Ready</span>
                <div style="display:flex; align-items:center; gap:0.5rem;">
                    <button id="zoomOutBtn" style="padding: 2px 6px;">-</button>
                    <span id="zoomLevel" style="width: 40px; text-align: center;">100%</span>
                    <button id="zoomInBtn" style="padding: 2px 6px;">+</button>
                </div>
                <span id="coordinates" style="font-family:monospace;">0, 0</span>
            </div>

            <div class="canvas-wrapper" id="canvasWrapper">
                <div style="position:relative; margin:auto;">
                    <canvas id="patternCanvas"></canvas>
                    
                    <!-- Empty State -->
                    <div id="emptyState" style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#cbd5e1; pointer-events:none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                        <p style="margin-top:1rem; font-weight:500;">Upload an image to start</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Hidden canvas for processing -->
    <canvas id="processCanvas" class="hidden"></canvas>

    <script src="script.js"></script>
</body>
</html>
